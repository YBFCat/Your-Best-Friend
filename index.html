<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Best Friend | Dermocosmética & K-Beauty 🎀</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fff9fb;
      --card-bg: #ffffff;
      --primary: #ff85a2;
      --primary-hover: #ff6b8b;
      --accent: #b5e2fa;
      --purple-accent: #e8dff5;
      --text-dark: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #f7d6e0;
      --shadow: 0 10px 25px rgba(255, 133, 162, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 60px; }

    .top-banner {
      background: linear-gradient(90deg, #ff85a2, #b5e2fa, #ff85a2);
      color: #2b2d42; font-weight: 700; font-size: 0.8rem; text-align: center; padding: 6px 10px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    header {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 2px solid var(--border-color);
      padding: 12px 24px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 15px; flex-wrap: wrap;
    }
    .logo { font-family: 'Fredoka', sans-serif; font-size: 1.6rem; color: var(--primary); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .search-box { flex: 1; max-width: 380px; position: relative; }
    .search-box input {
      width: 100%; padding: 10px 16px; border-radius: 20px; border: 2px solid var(--border-color); outline: none; font-size: 0.9rem; transition: 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }

    .cart-btn {
      background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); transition: 0.2s;
    }
    .cart-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    nav.nav-bar {
      background: #ffffff; border-bottom: 1px solid var(--border-color); display: flex; justify-content: center; position: relative; z-index: 90;
    }
    .nav-list { display: flex; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; justify-content: center; }
    .nav-item { position: relative; }
    .nav-link {
      display: block; padding: 14px 18px; color: var(--text-dark); font-weight: 700; font-size: 0.88rem; text-decoration: none; cursor: pointer; transition: 0.2s;
    }
    .nav-link:hover, .nav-item:hover > .nav-link { color: var(--primary); }

    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      background: white; border: 2px solid var(--border-color); border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12); padding: 20px; min-width: 480px;
      grid-template-columns: repeat(2, 1fr); gap: 20px; z-index: 200;
    }
    .nav-item:hover .dropdown-menu { display: grid; }

    .dropdown-col h4 { font-family: 'Fredoka', sans-serif; color: var(--primary); font-size: 0.95rem; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .dropdown-col a {
      display: block; padding: 6px 0; color: var(--text-dark); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: 0.2s; cursor: pointer;
    }
    .dropdown-col a:hover { color: var(--primary); padding-left: 5px; }

    .hero { text-align: center; padding: 25px 20px 10px; background: linear-gradient(180deg, #fff0f5 0%, var(--bg-color) 100%); }
    .hero h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2rem; color: var(--primary); margin-bottom: 6px; }
    .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto 10px; font-size: 0.95rem; }

    .filter-status { text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    .reset-filter-btn { background: var(--purple-accent); color: var(--text-dark); border: none; padding: 4px 10px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-left: 8px; font-size: 0.8rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .card {
      background: var(--card-bg); border-radius: 20px; border: 2px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #1d3557; padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; z-index: 2; }
    .card img { width: 100%; height: 210px; object-fit: contain; padding: 15px; background: #fff; border-bottom: 1px solid var(--border-color); }
    .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
    .price { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
    .add-btn {
      width: 100%; background: var(--purple-accent); color: #4a4e69; border: none; padding: 10px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2
